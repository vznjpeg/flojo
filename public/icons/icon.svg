<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient circle -->
  <circle cx="64" cy="64" r="64" fill="#FF4500"/>

  <!-- Reddit alien head simplified -->
  <g transform="translate(64, 64)">
    <!-- Head -->
    <circle cx="0" cy="-5" r="30" fill="white"/>

    <!-- Left eye -->
    <circle cx="-12" cy="-15" r="5" fill="#FF4500"/>

    <!-- Right eye -->
    <circle cx="12" cy="-15" r="5" fill="#FF4500"/>

    <!-- Mouth -->
    <path d="M -8 -2 Q 0 3 8 -2" stroke="#FF4500" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Left antenna -->
    <circle cx="-20" cy="-28" r="4" fill="white"/>
    <line x1="-15" y1="-30" x2="-22" y2="-35" stroke="white" stroke-width="3" stroke-linecap="round"/>

    <!-- Right antenna -->
    <circle cx="20" cy="-28" r="4" fill="white"/>
    <line x1="15" y1="-30" x2="22" y2="-35" stroke="white" stroke-width="3" stroke-linecap="round"/>

    <!-- Chat bubble (represents comments) -->
    <g transform="translate(0, 15)">
      <rect x="-22" y="0" width="44" height="28" rx="4" fill="#FFD700"/>
      <path d="M -8 28 L -4 22 L 4 22 Z" fill="#FFD700"/>
      <line x1="-15" y1="8" x2="15" y2="8" stroke="#FF4500" stroke-width="2" stroke-linecap="round"/>
      <line x1="-15" y1="14" x2="15" y2="14" stroke="#FF4500" stroke-width="2" stroke-linecap="round"/>
      <line x1="-15" y1="20" x2="10" y2="20" stroke="#FF4500" stroke-width="2" stroke-linecap="round"/>
    </g>
  </g>
</svg>
