<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flojo - Screen Recorder</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Flojo</h1>
      <p class="subtitle">YouTube Tutorial Recorder</p>
    </div>

    <div class="status-section">
      <div id="status" class="status-badge idle">Not Recording</div>
      <div id="timer" class="timer">00:00:00</div>
    </div>

    <div class="settings-section">
      <label class="setting-item">
        <input type="checkbox" id="recordScreen" checked>
        <span>Record Screen</span>
      </label>

      <label class="setting-item">
        <input type="checkbox" id="recordWebcam" checked>
        <span>Record Webcam (PiP)</span>
      </label>

      <label class="setting-item">
        <input type="checkbox" id="recordAudio" checked>
        <span>Record Audio</span>
      </label>

      <label class="setting-item">
        <input type="checkbox" id="recordSystemAudio" checked>
        <span>Record System Audio</span>
      </label>

      <label class="setting-item">
        <input type="checkbox" id="autoMinimize" checked>
        <span>Auto-minimize menu bar</span>
      </label>

      <div class="quality-control">
        <label for="quality">Video Quality:</label>
        <select id="quality">
          <option value="1080">1080p (1920x1080)</option>
          <option value="720" selected>720p (1280x720)</option>
          <option value="480">480p (854x480)</option>
        </select>
      </div>
    </div>

    <div class="button-group">
      <button id="startBtn" class="btn btn-primary">
        <span class="icon">●</span> Start Recording
      </button>
      <button id="pauseBtn" class="btn btn-secondary" disabled>
        <span class="icon">⏸</span> Pause
      </button>
    </div>

    <div class="button-group">
      <button id="stopBtn" class="btn btn-danger" disabled>
        <span class="icon">■</span> Stop
      </button>
      <button id="resetBtn" class="btn btn-warning" disabled>
        <span class="icon">↻</span> Reset
      </button>
    </div>

    <div class="download-section" id="downloadSection" style="display: none;">
      <button id="downloadBtn" class="btn btn-success">
        <span class="icon">⬇</span> Download Recording
      </button>
      <p class="file-info" id="fileInfo"></p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
